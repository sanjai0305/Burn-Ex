name: Burn-Ex AWS Production Continuous Deployment (CD)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'

permissions:
  id-token: write
  contents: read

jobs:
  deploy-to-aws:
    name: Build Release & Deploy to AWS EC2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Build SPA Bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Package Production Release Archive
        run: |
          RELEASE_TAG="${GITHUB_SHA::8}"
          ARCHIVE_NAME="burnex-release-${RELEASE_TAG}.tar.gz"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV

          # Create a staging folder for release bundling
          mkdir -p release_stage
          cp -r frontend/dist release_stage/frontend/dist
          cp -r backend release_stage/backend
          cp -r deploy release_stage/deploy
          
          # Remove virtualenvs, pycache, or unwanted local data
          find release_stage/ -name "__pycache__" -exec rm -rf {} +
          find release_stage/ -name "*.pyc" -delete
          rm -rf release_stage/backend/.env

          # Compress release archive
          tar -czf "${ARCHIVE_NAME}" -C release_stage .
          echo "[CD] Release archive created: ${ARCHIVE_NAME} ($(du -h ${ARCHIVE_NAME} | cut -f1))"

      - name: Authenticate to AWS via IAM OIDC Role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Upload Release Archive to Amazon S3
        run: |
          S3_BUCKET="${{ vars.DEPLOY_BUCKET }}"
          echo "[CD] Uploading ${ARCHIVE_NAME} to s3://${S3_BUCKET}/..."
          aws s3 cp "${ARCHIVE_NAME}" "s3://${S3_BUCKET}/${ARCHIVE_NAME}"

      - name: Trigger Automated EC2 Deployment via AWS Systems Manager (SSM)
        run: |
          INSTANCE_ID="${{ vars.EC2_INSTANCE_ID }}"
          S3_BUCKET="${{ vars.DEPLOY_BUCKET }}"
          
          echo "[CD] Sending SSM RunCommand to EC2 instance ${INSTANCE_ID}..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploying Burn-Ex Release ${RELEASE_TAG}" \
            --parameters 'commands=[
              "bash /var/www/burnex/current/deploy/deploy.sh '\'"${RELEASE_TAG}"\'' '\'"${S3_BUCKET}"\''"
            ]' \
            --query "Command.CommandId" \
            --output text)
          
          echo "[CD] SSM Command ID: ${COMMAND_ID}"
          
          # Wait for SSM command execution
          aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}"
            
          # Inspect command status and output
          STATUS=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query "Status" \
            --output text)
            
          echo "[CD] SSM Deployment Status: ${STATUS}"
          
          if [ "${STATUS}" != "Success" ]; then
            echo "[CD] ERROR: SSM Deployment failed!"
            aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "StandardErrorContent" \
              --output text
            exit 1
          fi
